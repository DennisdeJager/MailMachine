services:
  web:
    image: "${IMAGE_REF:-mailmachine-web:local}"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      DATABASE_URL: "postgres://mailmachine:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/mailmachine"
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailmachine
      POSTGRES_USER: mailmachine
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - mailmachine-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailmachine -d mailmachine"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mailmachine-postgres-data:
